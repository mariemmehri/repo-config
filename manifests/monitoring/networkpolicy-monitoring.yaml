# Every other namespace in this cluster runs default-deny-all + explicit
# scoped rules (charts/hr-app/templates/networkpolicy-*.yaml) — leaving
# "monitoring" wide open would be the one namespace that doesn't follow that
# posture, for no good reason. This mirrors it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Traffic *within* monitoring (Prometheus <-> Alertmanager, Grafana ->
# Prometheus, Prometheus -> kube-state-metrics/node-exporter) is left open
# pod-to-pod rather than pinned to each component's exact
# app.kubernetes.io/name label. Those labels are chart-version-specific and
# unverified against a live render of kube-prometheus-stack 87.21.0 in this
# cluster; guessing wrong here fails silently (dashboards show "No data",
# nothing errors) rather than loudly, which is worse than not having the
# policy at all. This keeps the namespace *boundary* zero-trust (nothing
# outside "monitoring" can reach in or be reached, except the two rules
# below) while accepting an open internal mesh among five stack components
# that are all part of the observability stack itself, not untrusted
# workloads — a bounded, documented compromise, same spirit as CNPG's
# fully-open egress in manifests/cnpg-network-policy*/networkpolicy-postgres.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-internal
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# DNS — identical two-podSelector pattern already proven in this cluster
# (charts/hr-app/templates/networkpolicy-backend.yaml); do NOT switch this
# to an ipBlock on kube-dns's ClusterIP, see docs/issues-rencontrees.md
# Issue 4 for why that was abandoned (not stable across a cluster recreate).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-egress-dns
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# kube-apiserver access — needed by three separate components (the
# Prometheus-Operator reconciling ServiceMonitor/PrometheusRule CRDs,
# kube-state-metrics listing cluster objects, and Prometheus's own
# "kubernetes" scrape job for API server metrics).
#
# A namespaceSelector-on-"default" version of this rule was tried first and
# empirically confirmed NOT to work, live on this cluster: kube-state-metrics
# logged "Tested communication with server" once, then exited (exitCode 2)
# after ~30s with no further output — a client-side timeout, not an RBAC or
# app error. Confirmed by direct test: `kubectl exec` a wget from a
# monitoring pod to the `kubernetes` Service's real backend
# (`kubectl get endpoints kubernetes -n default` -> 10.0.1.2:443) timed out;
# the exact same request from a pod in `argocd` (no NetworkPolicy at all)
# succeeded immediately. Root cause: 10.0.1.2 is the GKE master's endpoint,
# not a normal pod — Cilium/GKE Dataplane V2 has no pod/namespace identity to
# match a namespaceSelector against for that destination, so the rule silently
# never applies. Same class of GKE-control-plane-traffic quirk as CNPG's
# metadata-server rewrite issue (manifests/cnpg-network-policy*/networkpolicy-postgres.yaml),
# different mechanism. An ipBlock is the only thing that actually works here —
# this IS the officially recommended pattern for kube-apiserver egress
# specifically, unlike the DNS ClusterIP ipBlock that was abandoned (see
# Issue 4): there is no pod-backed alternative to fall back to for this one.
# Caveat: 10.0.1.2 is this cluster's current master endpoint — reconfirm with
# `kubectl get endpoints kubernetes -n default` after any cluster
# recreate/master IP change, it is not guaranteed to stay this value forever.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-egress-apiserver
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.1.2/32
      ports:
        - protocol: TCP
          port: 443
---
# The one genuine cross-namespace scrape path: Prometheus reaching
# hr-backend in staging on /actuator/prometheus. Staging-only, matching the
# ServiceMonitor's namespaceSelector in servicemonitor-hr-backend.yaml — add
# dev/prod rules here in lockstep if that ServiceMonitor's scope is ever
# widened, or Prometheus will have a target it's configured to scrape but
# can't reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-egress-hr-backend-staging
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: staging
          podSelector:
            matchLabels:
              app: hr-backend
      ports:
        - protocol: TCP
          port: 8081
