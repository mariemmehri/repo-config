registry:
  host: ""
  repository: ""

backend:
  image:
    name: hr-backend
    tag: "UNSET"
  replicas: 1
  port: 8081
  database:
    enabled: false
    secretName: ""
    cnpgClusterName: ""
  resources:
    requests:
      # Lowered from 100m so idle CPU usage (~2-5m observed across
      # dev/staging/prod) reads as a more meaningful percentage against
      # the HPA target (dev/staging ~40-45%, prod ~20% given its lower
      # baseline usage) instead of 2-6%. Trade-off: this is the same
      # denominator the HPA (staging/prod, 70% target) scales against,
      # so it also makes autoscaling meaningfully more sensitive to real
      # traffic than it was at 100m — a deliberate choice for demo
      # visibility, not a capacity-planning number.
      cpu: "10m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1

frontend:
  image:
    name: hr-frontend
    tag: "UNSET"
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

ingress:
  enabled: false
  host: ""
  staticIpName: ""
  tls:
    enabled: false
    secretName: ""
    issuerName: ""

networkPolicy:
  enabled: true
