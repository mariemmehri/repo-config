registry:
  host: ""
  repository: ""

backend:
  image:
    name: hr-backend
    tag: "UNSET"
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

frontend:
  image:
    name: hr-frontend
    tag: "UNSET"
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  port: 5432
  auth:
    # Nom d'un Secret existant (créé hors Git) à utiliser à la place des champs ci-dessous.
    # Recommandé pour tout environnement au-delà de la démo locale.
    existingSecretName: ""
    database: hrdb
    username: hruser
    password: "hrpass"
  storage:
    size: 5Gi
    # Vide = StorageClass par défaut du cluster (standard-rwo sur GKE)
    className: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

ingress:
  enabled: false
  host: ""

networkPolicy:
  enabled: true
  # ClusterIP du service kube-dns — dépend du cluster, override par environnement.
  # Récupérable via: kubectl get svc kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}'
  dnsClusterIP: ""
