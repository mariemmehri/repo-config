{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hr-backend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: hr-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hr-frontend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    # GCE Ingress health checks hit the pod directly via the NEG (container-native
    # load balancing) from GCP's own prober ranges, not from an hr-frontend pod —
    # without this, the backend service never passes its health check and every
    # /api request 502s at the load balancer, even though the pod itself is Ready.
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
  egress:
    # GKE's NodeLocal DNSCache intercepts kube-dns-ClusterIP:53 traffic and
    # answers from a per-node `node-local-dns` pod instead — confirmed live via
    # `cilium-dbg monitor --type drop`, which showed egress actually landing on
    # the node-local-dns pod IP, not kube-dns, and being denied because only
    # kube-dns was allowed. Both peers are needed: kube-dns for any node without
    # (or bypassing) the cache, node-local-dns for the real common path.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.backend.database.enabled }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.backend.database.cnpgClusterName }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
{{- end }}
