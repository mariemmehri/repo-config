apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: hr-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: hr-backend
  template:
    metadata:
      labels:
        app: hr-backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hr-backend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: {{ .Values.registry.host }}/{{ .Values.registry.repository }}/{{ .Values.backend.image.name }}:{{ .Values.backend.image.tag }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            {{- if .Values.postgres.enabled }}
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "{{ .Values.postgres.port }}"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecretName | default "postgres-credentials" }}
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecretName | default "postgres-credentials" }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecretName | default "postgres-credentials" }}
                  key: password
            {{- end }}
          resources:
            {{- .Values.backend.resources | toYaml | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health-check
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health-check
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 5
