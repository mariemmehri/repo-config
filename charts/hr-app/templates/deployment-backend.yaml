apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: hr-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: hr-backend
  template:
    metadata:
      labels:
        app: hr-backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hr-backend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: {{ .Values.registry.host }}/{{ .Values.registry.repository }}/{{ .Values.backend.image.name }}:{{ .Values.backend.image.tag }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            {{- if .Values.backend.database.enabled }}
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.secretName }}
                  key: jdbc-uri
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.secretName }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.secretName }}
                  key: password
            {{- end }}
          resources:
            {{- .Values.backend.resources | toYaml | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health-check
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health-check
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 5
