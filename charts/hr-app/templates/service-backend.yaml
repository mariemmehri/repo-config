apiVersion: v1
kind: Service
metadata:
  name: hr-backend
  namespace: {{ .Release.Namespace }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: hr-backend
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: {{ .Values.backend.port }}