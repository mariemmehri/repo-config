{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hr-frontend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: hr-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: hr-backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    # GKE Dataplane V2 (Cilium/anetd) still does not enforce a namespaceSelector/
    # podSelector egress rule against traffic routed via the kube-dns ClusterIP
    # (what /etc/resolv.conf actually uses) — verified live: pod-IP-targeted
    # queries work, ClusterIP-targeted queries time out. Only ipBlock on the
    # ClusterIP itself is reliably enforced pre-DNAT. See docs/issues-rencontrees.md
    # Issue 4 — this is not Calico-specific as previously assumed.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.dnsClusterIP }}/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
