apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Must land after cnpg-operator's CRDs exist (wave "-1").
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.io/charts
    chart: cluster
    targetRevision: 0.8.1
    helm:
      values: |
        type: postgresql
        version:
          postgresql: "16"

        # Top-level (not under cluster:) — pins the Cluster's (and its
        # Services'/Secrets'/ServiceAccount's) name regardless of this
        # Application/Helm release's own name. repo-infrastructure's
        # Workload Identity binding targets this exact name in prod.
        fullnameOverride: pg-prod

        cluster:
          # HA in prod only (dev/staging are single-instance). Requires
          # repo-infrastructure's GKE node pool to actually have >= 3 Ready
          # nodes before this syncs — see NODE_COUNT/MAX_NODE_COUNT.
          instances: 3

          # topologyKey overridden to hostname — the chart's own default
          # (topology.kubernetes.io/zone) is a no-op on this single-zone
          # (europe-west1-b) cluster, since every node shares the same zone
          # label. "preferred" (not "required") is deliberate: it degrades to
          # soft co-location if the node pool isn't ready yet instead of
          # leaving replica pods Pending forever.
          affinity:
            topologyKey: kubernetes.io/hostname
            podAntiAffinityType: preferred

          storage:
            size: 5Gi
            storageClass: standard-rwo

          # req == limit (Guaranteed QoS) — without this, pods have no
          # CPU/memory floor and OOM/CPU starvation on the small e2-standard-2
          # nodes can masquerade as a CNPG failover event.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"

          enableSuperuserAccess: true

          # Generates the pg-prod-app Secret with host/port/dbname/user/password.
          initdb:
            database: hrapp
            owner: hrapp

          # No monitoring stack (kube-prometheus-stack) exists in this
          # platform yet — leave disabled until that's added separately.
          monitoring:
            enabled: false

          # Binds the Cluster's auto-generated ServiceAccount ("pg-prod" in
          # this namespace) to the GSA created by repo-infrastructure's
          # modules/cnpg_backup (cnpg_backup_prod instantiation), via GKE
          # Workload Identity — no key file.
          serviceAccountTemplate:
            metadata:
              annotations:
                iam.gke.io/gcp-service-account: sa-cnpg-prod-backup@pfe-2026-495220.iam.gserviceaccount.com

          # Requires cnpg-plugin-barman-cloud.yaml (and its cert-manager
          # prerequisite) to already be synced — see sync-wave ordering.
          plugins:
            - name: barman-cloud.cloudnative-pg.io
              enabled: true
              isWALArchiver: true

        # Wires the plugin above to a GCS ObjectStore CR the chart generates
        # from this block. Uses GKE Workload Identity (gkeEnvironment: true)
        # via the pg-prod ServiceAccount annotated above — no key file, so no
        # credentials Secret is needed either (secret.create: false).
        backups:
          enabled: true
          provider: google
          method: plugin
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
          secret:
            create: false
          google:
            # Paste the value of `terraform output cnpg_backup_bucket_name_prod`
            # from repo-infrastructure's environments/staging after apply.
            bucket: cnpg-backup-prod-pfe-2026-495220
            path: "/"
            gkeEnvironment: true
          retentionPolicy: "30d"
          scheduledBackups:
            - name: daily-backup
              schedule: "0 0 0 * * *"
              backupOwnerReference: self
              method: plugin
              pluginConfiguration:
                name: barman-cloud.cloudnative-pg.io
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # No syncPolicy.automated block, deliberately — matches hr-prod's own
  # "no automated policy on anything prod" philosophy elsewhere in this repo.
  # A prod Postgres HA topology change should never auto-apply; deployment
  # requires an explicit `argocd app sync cnpg-cluster-prod`.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
