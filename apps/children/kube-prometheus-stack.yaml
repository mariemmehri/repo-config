apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Same wave as cnpg-operator: a platform-level operator that provides CRDs
    # (ServiceMonitor/PodMonitor) other Applications may reference later
    # (see cnpg-cluster-*.yaml's cluster.monitoring.enabled, currently false).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.0.1
    helm:
      values: |
        # GKE is a managed control plane — kube-scheduler/kube-controller-manager/etcd
        # are not reachable, and kube-proxy is not the standard component either.
        # Leave these default scrape targets disabled instead of alerting on
        # permanently-unreachable endpoints.
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        prometheus:
          service:
            type: ClusterIP
          prometheusSpec:
            retention: 7d
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: standard-rwo
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

        alertmanager:
          service:
            type: ClusterIP
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

        grafana:
          service:
            type: ClusterIP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          persistence:
            enabled: true
            size: 1Gi
            storageClassName: standard-rwo
          # admin.existingSecret points at a Secret created once out-of-band
          # (kubectl create secret generic kube-prometheus-stack-grafana-admin
          # -n monitoring --from-literal=admin-user=admin
          # --from-literal=admin-password=<random>), never committed to git.
          # Without existingSecret, the chart's default random-password
          # generation re-runs on every ArgoCD template render (Helm's
          # `lookup` returns empty in ArgoCD's rendering sandbox), producing a
          # new Secret content -> new checksum/secret pod annotation -> a
          # rolling restart on every sync, which deadlocks against the
          # ReadWriteOnce PVC (RollingUpdate can't attach the new pod's volume
          # while the old pod still holds it, and can't kill the old pod
          # first since maxUnavailable rounds down to 0 on a single replica).
          admin:
            existingSecret: kube-prometheus-stack-grafana-admin
            userKey: admin-user
            passwordKey: admin-password
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
