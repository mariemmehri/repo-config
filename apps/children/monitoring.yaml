apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.0.1
    helm:
      values: |
        # GKE control-plane components are Google-managed and unreachable —
        # these ServiceMonitors would sit permanently "down" otherwise.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        # Dataplane V2 (Cilium) replaces kube-proxy on this cluster — no target to scrape.
        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 7d
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi

        grafana:
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # 256Mi OOMKilled the grafana container in practice (steady-state
              # usage ~280-300Mi with the dashboard/datasources sidecars
              # loaded) — confirmed live via `kubectl describe pod` showing
              # Reason: OOMKilled, Exit Code: 137.
              memory: 512Mi
          # admin.existingSecret points at a Secret created once out-of-band
          # (kubectl create secret generic kube-prometheus-stack-grafana-admin
          # -n monitoring --from-literal=admin-user=admin
          # --from-literal=admin-password=<random>), never committed to git.
          # Without existingSecret, the chart's default random-password
          # generation re-runs on every ArgoCD template render (Helm's
          # `lookup` returns empty in ArgoCD's rendering sandbox), producing a
          # new Secret -> new checksum/secret pod annotation -> a rolling
          # restart on every sync (already hit and reverted twice in this
          # repo's history before this fix).
          admin:
            existingSecret: kube-prometheus-stack-grafana-admin
            userKey: admin-user
            passwordKey: admin-password

        prometheusOperator:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
