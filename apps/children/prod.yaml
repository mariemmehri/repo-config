apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hr-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mariemmehri/repo-config
    targetRevision: main
    path: charts/hr-app
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
        - /spec/replicas
  # Pas de syncPolicy.automated : la prod ne se synchronise JAMAIS seule.
  # Un commit sur values-prod.yaml met l'app OutOfSync; le déploiement réel
  # exige un sync manuel (UI ArgoCD ou `argocd app sync hr-prod`).
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
