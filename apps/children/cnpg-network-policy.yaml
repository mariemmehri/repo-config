apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-network-policy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Must exist before pg-staging's pods start (wave "0") — same wave as
    # cnpg-operator/cnpg-plugin-barman-cloud, ahead of cnpg-cluster-staging.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/mariemmehri/repo-config
    targetRevision: main
    path: manifests/cnpg-network-policy
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
